<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAU Mevzuat</title>
<style>
  :root {
    --paper: #f7f7f4; --card: #ffffff; --ink: #1c1f23; --muted: #6b6f76; --line: #dcdcd6;
    --red: #b3261e; --red-soft: #fbeae8; --focus: #2f6fed;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, "Segoe UI", sans-serif;
    --mono: Consolas, "Cascadia Code", ui-monospace, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141618; --card: #1d2024; --ink: #e9e7e1; --muted: #9a9ea6; --line: #33373d; --red: #ef6a5f; --red-soft: #3a1f1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; }
  header h1 { font: 400 28px/1 var(--serif); margin: 0; letter-spacing: -0.01em; }
  header h1 b { color: var(--red); font-weight: 400; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .field { position: relative; }
  textarea {
    width: 100%; min-height: 76px; padding: 14px 92px 14px 16px; resize: none;
    font: 17px/1.45 var(--sans); color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  textarea::placeholder { color: var(--muted); }
  #btn {
    position: absolute; right: 10px; bottom: 10px; padding: 8px 16px;
    font: 600 14px var(--sans); color: #fff; background: var(--red); border: 0; border-radius: 7px; cursor: pointer;
  }
  #btn:disabled { opacity: .55; cursor: progress; }
  #btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bar { height: 2px; margin-top: -2px; border-radius: 0 0 10px 10px; overflow: hidden; visibility: hidden; }
  .bar.on { visibility: visible; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--red); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  .tools { display: flex; align-items: center; gap: 10px; margin: 10px 2px 0; font: 12px var(--mono); color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 2px 0; }
  .chips button {
    font: 13px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px; cursor: pointer;
  }
  .chips button:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; font: 12px var(--mono); }
  .seg label { padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .seg input { position: absolute; opacity: 0; }
  .seg input:checked + span { color: var(--ink); }
  .seg label:has(input:checked) { background: var(--card); color: var(--ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }

  #stream { margin-top: 36px; display: flex; flex-direction: column; gap: 36px; }
  .qa { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .qa + .qa { opacity: .62; }
  .qa .q { font: 500 15px var(--sans); color: var(--muted); margin: 0 0 10px; }
  .qa .q::before { content: "Soru — "; color: var(--red); font-family: var(--mono); font-size: 12px; }
  .a { font-size: 17px; line-height: 1.6; margin: 0; }
  .a.none { color: var(--muted); font-style: italic; }
  .cite {
    display: inline-block; font: 600 11px/1 var(--mono); color: var(--red); background: var(--red-soft);
    border-radius: 4px; padding: 3px 5px; margin: 0 1px; vertical-align: 2px; cursor: pointer;
  }
  .cite:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cite.hot, .art.hot { box-shadow: 0 0 0 2px var(--red); }
  .art.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--red); } }
  .meta { font: 12px var(--mono); color: var(--muted); margin: 10px 0 0; }
  .err { color: var(--red); }

  .arts { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .art {
    display: grid; grid-template-columns: 118px 1fr; gap: 0 18px; padding: 16px 18px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; transition: box-shadow .15s;
  }
  .art .no { font: italic 24px/1 var(--serif); color: var(--red); white-space: nowrap; }
  .art .no small { display: block; font: 600 10px/1 var(--mono); letter-spacing: .12em; color: var(--muted); margin-bottom: 6px; font-style: normal; }
  .art .head { font: 600 14px var(--sans); margin: 0 0 2px; }
  .art .doc { font: 12px var(--sans); color: var(--muted); margin: 0 0 8px; }
  .art .txt { font: 14px/1.55 var(--sans); color: var(--ink); margin: 0; white-space: pre-line; opacity: .9; }
  .art.long:not(.open) .txt { max-height: 8.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .art .more { font: 12px var(--mono); color: var(--muted); margin: 6px 0 0; }
  .art:not(.long) .more, .art.open .more { display: none; }
  @media (max-width: 520px) {
    .art { grid-template-columns: 1fr; }
    .art .no { margin-bottom: 8px; }
    main { padding-top: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .qa, .bar i, .art.flash { animation: none; } .art.flash { box-shadow: 0 0 0 3px var(--red); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>BAU <b>Mevzuat</b></h1>
    <p>Anayasa ve BAU yönetmelikleri. Sor, maddesiyle cevaplasın.</p>
  </header>

  <form id="f">
    <div class="field">
      <textarea id="q" placeholder="Sınavda kopya çekersem ne olur?" required minlength="3" maxlength="500" rows="2"></textarea>
      <button id="btn" type="submit">Sor</button>
      <div class="bar" id="bar"><i></i></div>
    </div>
    <div class="tools">
      <span>arama</span>
      <div class="seg" role="radiogroup" aria-label="Arama yöntemi">
        <label><input type="radio" name="mode" value="hybrid" checked><span>hybrid</span></label>
        <label><input type="radio" name="mode" value="dense"><span>dense</span></label>
        <label><input type="radio" name="mode" value="bm25"><span>bm25</span></label>
      </div>
    </div>
    <div class="chips" id="chips">
      <button type="button">Kayıt dondurunca ücret öder miyim?</button>
      <button type="button">Bütünleme sınavına kimler girebilir?</button>
      <button type="button">Diplomamı kaybedersem ne yapmalıyım?</button>
    </div>
  </form>

  <section id="stream" aria-live="polite"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NOT_FOUND = "Bu konuda mevzuatta bilgi bulamadım.";

function ask(question) {
  $("q").value = question;
  $("f").requestSubmit();
}
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); }
});

function render(question, body) {
  const none = body.answer === NOT_FOUND;
  const answer = esc(body.answer).replace(/\[(\d+)\]/g, (_, n) => `<span class="cite" data-n="${n}" role="button" tabindex="0" title="Kaynağa git">${n}</span>`);
  const arts = body.citations.map((c, i) => `
    <article class="art${c.text.length > 700 ? " long" : ""}" data-n="${i + 1}">
      <div class="no"><small>KAYNAK ${i + 1}</small>${c.article_no ? `${c.article_kind ? c.article_kind + " " : ""}Madde ${c.article_no}` : "—"}</div>
      <div>
        ${c.heading ? `<p class="head">${esc(c.heading)}</p>` : ""}
        <p class="doc">${esc(c.doc_title)}</p>
        <p class="txt">${esc(c.text.replace(/^(?:(?:GEÇİCİ|EK)\s+)?MADDE\s+\d+\s*[-–—]?\s*/i, ""))}</p>
        <p class="more">devamını göster</p>
      </div>
    </article>`).join("");
  return `
    <div class="qa">
      <p class="q">${esc(question)}</p>
      <p class="a${none ? " none" : ""}">${answer}</p>
      <p class="meta">${body.mode} · ${body.latency_ms} ms${body.citations.length ? ` · ${body.citations.length} kaynak` : ""}</p>
      ${arts ? `<div class="arts">${arts}</div>` : ""}
    </div>`;
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  $("btn").disabled = true; $("bar").classList.add("on");
  try {
    const r = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);
    $("stream").insertAdjacentHTML("afterbegin", render(question, body));
    $("q").value = "";
  } catch (err) {
    $("stream").insertAdjacentHTML("afterbegin",
      `<div class="qa"><p class="q">${esc(question)}</p><p class="a err">${esc(err.message)}</p></div>`);
  } finally {
    $("btn").disabled = false; $("bar").classList.remove("on"); $("q").focus();
  }
});

function goToSource(cite) {
  const art = cite.closest(".qa").querySelector(`.art[data-n="${cite.dataset.n}"]`); if (!art) return;
  art.classList.add("open");
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  art.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  art.classList.remove("flash"); void art.offsetWidth; art.classList.add("flash");
}
$("stream").addEventListener("click", e => {
  const cite = e.target.closest(".cite"); if (cite) return goToSource(cite);
  const art = e.target.closest(".art.long"); if (art) art.classList.toggle("open");
});
$("stream").addEventListener("keydown", e => {
  const cite = e.target.closest(".cite");
  if (cite && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); goToSource(cite); }
});

// hover a [n] marker <-> its article card
$("stream").addEventListener("mouseover", e => {
  const el = e.target.closest("[data-n]"); if (!el) return;
  const qa = el.closest(".qa");
  qa.querySelectorAll(`[data-n="${el.dataset.n}"]`).forEach(x => x.classList.add("hot"));
});
$("stream").addEventListener("mouseout", e => {
  const el = e.target.closest("[data-n]"); if (!el) return;
  el.closest(".qa").querySelectorAll(".hot").forEach(x => x.classList.remove("hot"));
});
</script>
</body>
</html>
