[project]
name = "bau-mevzuat-rag"
version = "0.1.0"
description = "Turkish RAG over Bahçeşehir University regulations with article-level citations and a retrieval eval harness"
requires-python = ">=3.12"
dependencies = [
  "qdrant-client>=1.12",
  "rank-bm25>=0.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pypdf>=5",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
tracing = ["langfuse>=3"]
rerank = ["sentence-transformers>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
